<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dagen då det vände – Ord och uttryck</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e8e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 14px 28px 10px;
    border-bottom: 1px solid #2a2a3e;
    flex-shrink: 0;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    color: #c8c8e0;
    letter-spacing: 0.02em;
  }

  .subtitle {
    font-size: 0.78rem;
    color: #6060a0;
    margin-top: 2px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    padding: 10px 28px 0;
    flex-shrink: 0;
  }

  .tab {
    padding: 7px 20px;
    border-radius: 8px 8px 0 0;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.15s;
    opacity: 0.5;
    background: transparent;
    letter-spacing: 0.03em;
  }

  .tab:hover { opacity: 0.8; }
  .tab.active { opacity: 1; }

  .tab-alla    { color: #e8e8f0; }
  .tab-verb    { color: #7eb8f7; }
  .tab-subst   { color: #79d99a; }
  .tab-adj     { color: #f5a742; }
  .tab-ovrigt  { color: #c084fc; }

  .tab.active.tab-alla   { background: #1e2030; border-bottom: 2px solid #e8e8f0; }
  .tab.active.tab-verb   { background: #0d1a2d; border-bottom: 2px solid #7eb8f7; }
  .tab.active.tab-subst  { background: #0d2318; border-bottom: 2px solid #79d99a; }
  .tab.active.tab-adj    { background: #2a1a00; border-bottom: 2px solid #f5a742; }
  .tab.active.tab-ovrigt { background: #1a0d2a; border-bottom: 2px solid #c084fc; }

  .badge {
    font-size: 0.65rem;
    font-weight: 700;
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 1px 6px;
    margin-left: 5px;
    vertical-align: middle;
  }

  .cloud-wrapper {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .cloud {
    display: none;
    width: 100%;
    height: 100%;
    padding: 16px 28px 12px;
    align-content: center;
    flex-wrap: wrap;
    gap: 6px 12px;
    align-items: center;
    justify-content: center;
  }

  .cloud.active { display: flex; }

  .word {
    display: inline-block;
    line-height: 1.2;
    white-space: nowrap;
    transition: transform 0.15s, opacity 0.15s;
    cursor: default;
    border-radius: 4px;
    padding: 1px 3px;
  }

  .word:hover {
    transform: scale(1.15);
    opacity: 1 !important;
    z-index: 10;
    position: relative;
  }

  /* frequency-based sizes */
  .f6 { font-size: 2.8rem; font-weight: 800; }
  .f5 { font-size: 2.2rem; font-weight: 800; }
  .f4 { font-size: 1.7rem; font-weight: 700; }
  .f3 { font-size: 1.25rem; font-weight: 600; }
  .f2 { font-size: 0.95rem; font-weight: 500; }
  .f1 { font-size: 0.72rem; font-weight: 400; }

  /* colors per class */
  .c-verb    { color: #7eb8f7; }
  .c-subst   { color: #79d99a; }
  .c-adj     { color: #f5a742; }
  .c-ovrigt  { color: #c084fc; }

  /* dim lower frequency words a bit */
  .f1 { opacity: 0.65; }
  .f2 { opacity: 0.8; }

  .legend {
    display: flex;
    gap: 18px;
    padding: 4px 28px 8px;
    font-size: 0.72rem;
    flex-shrink: 0;
    border-top: 1px solid #1a1a2e;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0.7;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .dot-verb   { background: #7eb8f7; }
  .dot-subst  { background: #79d99a; }
  .dot-adj    { background: #f5a742; }
  .dot-ovrigt { background: #c084fc; }
</style>
</head>
<body>

<header>
  <h1>Dagen då det vände &mdash; Ord och uttryck</h1>
  <div class="subtitle">Elevernas inmatade ord, grupperade efter ordklass</div>
</header>

<div class="tabs">
  <button class="tab tab-alla active" onclick="show('alla')">Alla ord <span class="badge">347</span></button>
  <button class="tab tab-verb"   onclick="show('verb')">Verb <span class="badge">174</span></button>
  <button class="tab tab-subst"  onclick="show('subst')">Substantiv <span class="badge">61</span></button>
  <button class="tab tab-adj"    onclick="show('adj')">Adjektiv <span class="badge">47</span></button>
  <button class="tab tab-ovrigt" onclick="show('ovrigt')">Övrigt <span class="badge">65</span></button>
</div>

<div class="cloud-wrapper">
  <div class="cloud active" id="cloud-alla"></div>
  <div class="cloud" id="cloud-verb"></div>
  <div class="cloud" id="cloud-subst"></div>
  <div class="cloud" id="cloud-adj"></div>
  <div class="cloud" id="cloud-ovrigt"></div>

<div class="legend">
  <div class="legend-item"><div class="dot dot-verb"></div> Verb</div>

  <div class="legend-item"><div class="dot dot-adj"></div> Adjektiv</div>

</div>

const classMap = {
  'verb':      { key: 'verb',   colorClass: 'c-verb' },
  'substantiv':{ key: 'subst',  colorClass: 'c-subst' },
  'adjektiv':  { key: 'adj',    colorClass: 'c-adj' },
  'övrigt':    { key: 'ovrigt', colorClass: 'c-ovrigt' },
};

function freqClass(f) {
  if (f >= 6) return 'f6';
  if (f >= 5) return 'f5';
  if (f >= 4) return 'f4';
  if (f >= 3) return 'f3';
  if (f >= 2) return 'f2';
  return 'f1';
}

function buildCloud(containerId, filterClass) {
  const el = document.getElementById(containerId);
  const filtered = filterClass === 'alla'
    ? [...words].sort((a, b) => b.freq - a.freq)
    : words.filter(w => {
        const m = classMap[w.class];
        return m && m.key === filterClass;
      }).sort((a, b) => b.freq - a.freq);

  el.innerHTML = '';
  filtered.forEach(w => {
    const m = classMap[w.class] || { colorClass: 'c-ovrigt' };
    const span = document.createElement('span');
    span.className = `word ${freqClass(w.freq)} ${m.colorClass}`;
    span.textContent = w.word;
    span.title = `${w.word} · ${w.class} · nämndes ${w.freq} gång${w.freq > 1 ? 'er' : ''}`;
    el.appendChild(span);
  });
}

buildCloud('cloud-alla',   'alla');
buildCloud('cloud-verb',   'verb');
buildCloud('cloud-subst',  'subst');
buildCloud('cloud-adj',    'adj');
buildCloud('cloud-ovrigt', 'ovrigt');

function show(tab) {
  document.querySelectorAll('.cloud').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('cloud-' + tab).classList.add('active');
  document.querySelector('.tab-' + (tab === 'subst' ? 'subst' : tab)).classList.add('active');
}

// keyboard shortcuts: 1–5 to switch tabs
document.addEventListener('keydown', e => {
  const map = { '1': 'alla', '2': 'verb', '3': 'subst', '4': 'adj', '5': 'ovrigt' };
  if (map[e.key]) show(map[e.key]);
});
</script>
</body>
