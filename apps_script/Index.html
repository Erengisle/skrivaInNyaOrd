<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f3f6ff;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      width: min(520px, 92vw);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 { margin-top: 0; }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
      box-sizing: border-box;
    }

    textarea { min-height: 120px; }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    #status {
      margin-top: 10px;
      font-weight: 600;
      text-align: center;
    }

    .hint {
      font-size: 0.9rem;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Svåra ord</h1>
    <input id="student" placeholder="Ditt namn">
    <textarea id="words" placeholder="Skriv flera ord separerade med mellanslag eller kommatecken"></textarea>
    <button onclick="save()">Skicka ord</button>
    <div id="status"></div>
    <p class="hint">Du kan skriva flera ord och skicka alla samtidigt.</p>
  </div>

  <script>
    function tokenize(text) {
      return text
        .toLowerCase()
        .replace(/[.,;:!?]/g, ' ')
        .split(/\s+/)
        .filter(Boolean);
    }

    function save() {
      const student = document.getElementById('student').value.trim();
      const words = tokenize(document.getElementById('words').value);
      const status = document.getElementById('status');

      if (!student) { status.textContent = 'Skriv ditt namn'; return; }
      if (!words.length) { status.textContent = 'Skriv minst ett ord'; return; }

      status.textContent = 'Sparar...';

      google.script.run
        .withSuccessHandler(res => {
          status.textContent = res.message;
          if (res.ok) document.getElementById('words').value = '';
        })
        .withFailureHandler(err => {
          status.textContent = 'Fel: ' + err.message;
        })
        .submitWords({ student, words });
    }
  </script>
</body>
</html>
