<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #f3f6ff;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      width: min(520px, 100%);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #475569;
      margin: 14px 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      font-size: 1rem;
      background: white;
      transition: border-color 0.15s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #2563eb;
    }
    .hidden { display: none; }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: default; }
    #status {
      margin-top: 10px;
      font-weight: 600;
      text-align: center;
      min-height: 1.4em;
    }
    .ok { color: #16a34a; }
    .err { color: #dc2626; }
    #counter {
      margin-top: 10px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      color: #16a34a;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Svåra ord</h1>

    <label for="student">Ditt namn</label>
    <input id="student" placeholder="Förnamn + initial (t.ex. Anna K)" autocomplete="off">

    <label for="word">Ord</label>
    <input id="word" placeholder="Skriv ett ord" autocomplete="off" autocorrect="off" spellcheck="false">

    <label for="ordklass">Ordklass</label>
    <select id="ordklass">
      <option value="">Välj ordklass…</option>
      <option value="verb">Verb</option>
      <option value="substantiv">Substantiv</option>
      <option value="adjektiv">Adjektiv</option>
      <option value="övrigt">Övrigt</option>
    </select>

    <div id="verbgrupp-wrap" class="hidden">
      <label for="verbgrupp">Verbgrupp</label>
      <select id="verbgrupp">
        <option value="">Välj grupp…</option>
        <option value="1">Grupp 1</option>
        <option value="2a">Grupp 2a</option>
        <option value="2b">Grupp 2b</option>
        <option value="3">Grupp 3</option>
        <option value="4">Grupp 4</option>
      </select>
    </div>

    <div id="deklination-wrap" class="hidden">
      <label for="deklination">Deklination</label>
      <select id="deklination">
        <option value="">Välj deklination…</option>
        <option value="1">Dekl 1</option>
        <option value="2">Dekl 2</option>
        <option value="3">Dekl 3</option>
        <option value="4">Dekl 4</option>
        <option value="5">Dekl 5</option>
      </select>
    </div>

    <button id="send-btn" onclick="save()">Skicka</button>
    <div id="status"></div>
    <div id="counter" class="hidden">✓ <span id="count">0</span> ord inskickade</div>
  </div>

  <script>
    const ordklassEl     = document.getElementById('ordklass');
    const verbGruppWrap  = document.getElementById('verbgrupp-wrap');
    const deklWrap       = document.getElementById('deklination-wrap');
    const verbGruppEl    = document.getElementById('verbgrupp');
    const deklEl         = document.getElementById('deklination');
    let wordCount = 0;

    ordklassEl.addEventListener('change', () => {
      const v = ordklassEl.value;
      verbGruppWrap.classList.toggle('hidden', v !== 'verb');
      deklWrap.classList.toggle('hidden', v !== 'substantiv');
      verbGruppEl.value = '';
      deklEl.value = '';
    });

    // Persist name across sessions
    const studentEl = document.getElementById('student');
    const saved = localStorage.getItem('studentName');
    if (saved) studentEl.value = saved;
    studentEl.addEventListener('blur', () => {
      localStorage.setItem('studentName', studentEl.value.trim());
    });

    // Submit on Enter in word field
    document.getElementById('word').addEventListener('keydown', e => {
      if (e.key === 'Enter') save();
    });

    function save() {
      const student  = studentEl.value.trim();
      const word     = document.getElementById('word').value.trim().toLowerCase();
      const ordklass = ordklassEl.value;
      const verbgrupp   = verbGruppEl.value;
      const deklination = deklEl.value;
      const btn      = document.getElementById('send-btn');

      if (!student)  { setStatus('Skriv ditt namn.', false); return; }
      if (!word)     { setStatus('Skriv ett ord.', false); return; }
      if (!ordklass) { setStatus('Välj ordklass.', false); return; }

      btn.disabled = true;
      setStatus('Sparar…', null);

      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false;
          if (res.ok) {
            wordCount++;
            document.getElementById('count').textContent = wordCount;
            document.getElementById('counter').classList.remove('hidden');
            setStatus('', null);
            document.getElementById('word').value = '';
            ordklassEl.value = '';
            verbGruppEl.value = '';
            deklEl.value = '';
            verbGruppWrap.classList.add('hidden');
            deklWrap.classList.add('hidden');
            document.getElementById('word').focus();
          } else {
            setStatus(res.message, false);
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          setStatus('Fel: ' + err.message, false);
        })
        .submitWords({ student, words: [word], ordklass, verbgrupp, deklination });
    }

    function setStatus(msg, ok) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = ok === true ? 'ok' : ok === false ? 'err' : '';
    }
  </script>
</body>
</html>
