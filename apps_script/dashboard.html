<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f3f6ff;
      margin: 0;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 960px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    h2 { margin-top: 0; font-size: 1rem; color: #374151; text-transform: uppercase; letter-spacing: 0.05em; }
    h3 { margin: 0 0 8px; font-size: 0.95rem; color: #2563eb; }

    table { width: 100%; border-collapse: collapse; }
    td, th { text-align: left; padding: 6px; border-bottom: 1px solid #eee; }

    .big { font-size: 2.5rem; font-weight: bold; color: #2563eb; }

    .word-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-top: 4px;
    }

    .group-row { margin-bottom: 6px; font-size: 0.9rem; }
    .group-label { font-weight: 600; color: #374151; margin-right: 6px; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-header h2 { margin: 0; }

    .refresh-btn {
      padding: 4px 12px;
      border: none;
      border-radius: 6px;
      background: #e0e7ff;
      color: #2563eb;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .refresh-btn:hover { background: #c7d2fe; }

    .muted { color: #6b7280; font-size: 0.85rem; }
  </style>
</head>

<body>
  <div class="grid">

    <div class="card">
      <h2>Totalt antal ord</h2>
      <div id="total" class="big">...</div>
    </div>

    <div class="card">
      <h2>Elever</h2>
      <div id="students"></div>
    </div>

    <div class="card" style="grid-column: span 2;">
      <div class="card-header">
        <h2>Ordanalys</h2>
        <button class="refresh-btn" id="refresh-words">Uppdatera</button>
      </div>
      <div id="word-status" class="muted"></div>
      <div class="word-grid">
        <div>
          <h3>Verb</h3>
          <div id="verb-groups"></div>
        </div>
        <div>
          <h3>Substantiv</h3>
          <div id="noun-groups"></div>
        </div>
        <div>
          <h3>Övriga</h3>
          <div id="other-words"></div>
        </div>
      </div>
    </div>

    <div class="card" style="grid-column: span 2;">
      <h2>Senaste inlämningar</h2>
      <table>
        <thead><tr><th>Tid</th><th>Elev</th><th>Ord</th></tr></thead>
        <tbody id="latest"></tbody>
      </table>
    </div>

  </div>

  <script>
    function renderStats(data) {
      document.getElementById('total').textContent = data.totalWords;

      const studentsDiv = document.getElementById('students');
      studentsDiv.innerHTML = '';
      Object.entries(data.perStudent)
        .sort((a, b) => b[1] - a[1])
        .forEach(([name, count]) => {
          const div = document.createElement('div');
          div.textContent = `${name}: ${count} ord`;
          studentsDiv.appendChild(div);
        });

      const tbody = document.getElementById('latest');
      tbody.innerHTML = '';
      data.lastEntries.forEach(({ time, student, word }) => {
        const row = document.createElement('tr');
        [time, student, word].forEach(val => {
          const td = document.createElement('td');
          td.textContent = val;
          row.appendChild(td);
        });
        tbody.appendChild(row);
      });
    }

    function groupBy(items, key) {
      return items.reduce((acc, item) => {
        const k = item[key] || 'okänd';
        (acc[k] = acc[k] || []).push(item);
        return acc;
      }, {});
    }

    function renderWordGroup(containerId, groups, prefix) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      const entries = Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0], 'sv'));
      if (!entries.length) { container.textContent = '–'; return; }
      entries.forEach(([key, items]) => {
        const div = document.createElement('div');
        div.className = 'group-row';
        const label = document.createElement('span');
        label.className = 'group-label';
        label.textContent = `${prefix} ${key}:`;
        div.appendChild(label);
        div.appendChild(document.createTextNode(items.map(w => w.lemma).join(', ')));
        container.appendChild(div);
      });
    }

    function renderWords(words) {
      document.getElementById('word-status').textContent = '';
      const verbs  = words.filter(w => w.ordklass === 'verb');
      const nouns  = words.filter(w => w.ordklass === 'substantiv');
      const others = words.filter(w => w.ordklass !== 'verb' && w.ordklass !== 'substantiv');

      renderWordGroup('verb-groups', groupBy(verbs, 'verbgrupp'), 'Grupp');
      renderWordGroup('noun-groups', groupBy(nouns, 'deklination'), 'Dekl.');

      const otherDiv = document.getElementById('other-words');
      otherDiv.innerHTML = '';
      if (!others.length) { otherDiv.textContent = '–'; return; }
      Object.entries(groupBy(others, 'ordklass')).sort().forEach(([cls, ws]) => {
        const div = document.createElement('div');
        div.className = 'group-row';
        const label = document.createElement('span');
        label.className = 'group-label';
        label.textContent = `${cls}:`;
        div.appendChild(label);
        div.appendChild(document.createTextNode(ws.map(w => w.lemma).join(', ')));
        otherDiv.appendChild(div);
      });
    }

    function loadStats() {
      google.script.run.withSuccessHandler(renderStats).getDashboardData();
    }

    function loadWords() {
      const status = document.getElementById('word-status');
      status.textContent = 'Laddar...';
      google.script.run
        .withSuccessHandler(words => {
          if (!words.length) {
            status.textContent = 'Inga ord ännu — kör "Uppdatera översikt" i Sheet-menyn först.';
            ['verb-groups', 'noun-groups', 'other-words'].forEach(id => {
              document.getElementById(id).textContent = '–';
            });
          } else {
            renderWords(words);
          }
        })
        .withFailureHandler(() => {
          status.textContent = 'Kunde inte hämta orddata.';
        })
        .getDashboardWords();
    }

    document.getElementById('refresh-words').addEventListener('click', loadWords);

    loadStats();
    loadWords();
    setInterval(loadStats, 5000);
  </script>
</body>
</html>
